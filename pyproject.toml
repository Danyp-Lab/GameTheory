[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "game-theory-algorithms"
version = "1.0.0"
description = "Computational game theory models, Nash equilibrium solvers, and strategic matrix games"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Danial Pahlavan", email = "danialpahlavan@gmail.com" },
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=7.0.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
